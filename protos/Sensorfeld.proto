#VRML_SIM R2025a utf8
# template language: javascript
# Sensorflaeche fuer die ReBeL-Simulation (Stufe F2): halbdurchsichtiger Quader ohne Physik.
# Der Controller "irc_bridge" prueft, ob ein Werkstueck den Quader belegt, setzt den
# zugeordneten Eingang in iRC und faerbt das Feld (grau = frei, gruen = belegt).
# Ursprung = Mitte der Unterseite, "groesse" = Laenge, Breite, Hoehe in Metern.
# Welcher Eingang dazu gehoert, steht in worlds/<welt>.json unter "ea" -> "sensoren".

PROTO Sensorfeld [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation    0 0 1 0
  field SFString   name        "sensor"
  field SFVec3f    groesse     0.04 0.04 0.02
  field SFColor    farbe       0.55 0.6 0.7
]
{
  Pose {
    translation IS translation
    rotation IS rotation
    children [
      Pose {
        translation 0 0 %<= fields.groesse.value.z / 2 >%
        children [
          Shape {
            appearance PBRAppearance { baseColor IS farbe transparency 0.6 roughness 1 metalness 0 }
            geometry Box { size IS groesse }
            castShadows FALSE
            isPickable FALSE
          }
        ]
      }
    ]
  }
}
