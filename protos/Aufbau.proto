#VRML_SIM R2025a utf8
# Feststehender Aufbau auf dem Robotertisch aus einer eigenen CAD-Datei (STL/OBJ),
# z.B. Magazin, Vorrichtung, Foerderband-Attrappe. Bewegt sich nicht, Werkstuecke
# koennen darauf abgelegt werden und der Roboter kann damit kollidieren.
# "skalierung" 0.001 fuer Dateien in Millimetern (FreeCAD, Fusion, Onshape).
# material: pla, stahl, edelstahl, alu, messing, holz (Stufe G1); rauheit/metall: Aussehen.

PROTO Aufbau [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation    0 0 1 0
  field SFString   name        "aufbau"
  field MFString   modell      []
  field SFFloat    skalierung  0.001
  field SFColor    farbe       0.7 0.7 0.72
  field SFString   material    "pla"
  field SFFloat    rauheit     0.6
  field SFFloat    metall      0.1
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      DEF FORM Transform {
        scale %<= fields.skalierung.value >% %<= fields.skalierung.value >% %<= fields.skalierung.value >%
        children [ Shape { appearance PBRAppearance { baseColor IS farbe roughness IS rauheit metalness IS metall } geometry Mesh { url IS modell } } ]
      }
    ]
    boundingObject USE FORM
  }
}
